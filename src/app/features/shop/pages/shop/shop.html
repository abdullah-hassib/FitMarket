
<div class="shop-heading">
  <div>
    <span class="shop-eyebrow">PERFORMANCE / FITMARKET STORE</span>
    <h1>Gear up. Go further.</h1>
    <p>Equipment, sportswear and training essentials for every session.</p>
  </div>
  <a routerLink="/shop/cart" class="shop-cart-link">View cart →</a>
</div>

<!-- Search Bar -->
<div class="search-container">
  <input
    type="search"
    placeholder="Search products..."
    aria-label="Search products"
    [value]="searchQuery()"
    (input)="onSearch($event)"
  />
</div>

<!-- Category Filter -->
<div class="filter-container">
  <label for="category">Category:</label>

  <select
    id="category"
    [value]="selectedCategory()"
    (change)="onCategoryChange($event)"
  >
    <option value="All">All Products</option>
    <option value="Equipment">Equipment</option>
    <option value="Sportswear">Sportswear</option>
    <option value="Supplements">Supplements</option>
    <option value="Training Plans">Training Plans</option>
  </select>
</div>

<!-- Price Sorting: ADD THIS SECTION -->
<div class="sort-container">
  <label for="sort">Sort by:</label>

  <select
    id="sort"
    [value]="sortOrder()"
    (change)="onSortChange($event)"
  >
    <option value="default">Default</option>
    <option value="price-low">Price: Low to High</option>
    <option value="price-high">Price: High to Low</option>
  </select>
</div>

<!-- Product Grid -->
<div class="products">
  @for (product of filteredProducts(); track product.id) {
    <app-product-card [product]="product" />
  } @empty {
    <p>No products found.</p>
  }
</div>
