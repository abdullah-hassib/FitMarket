name: Jasmine Karma compatibility probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/karma-probe.yml
      - src/**
      - package.json

permissions:
  contents: read

jobs:
  karma-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Keep original dependency lock
        run: cp package-lock.json /tmp/fitmarket-lock-original.json
      - name: Install official Jasmine Karma dependencies
        run: npm install --save-dev karma karma-chrome-launcher karma-coverage karma-jasmine karma-jasmine-html-reporter jasmine-core @types/jasmine
      - name: Print lockfile delta for maintainer review
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/fitmarket-lock-original.json', 'utf8'));
          const b = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changed = Object.fromEntries(Object.entries(b.packages).filter(([k,v])=>JSON.stringify(a.packages[k])!==JSON.stringify(v)));
          const removed = Object.keys(a.packages).filter(k=>!Object.hasOwn(b.packages,k));
          const delta = JSON.stringify({changed, removed});
          for(let i=0;i<delta.length;i+=1500){
            console.log('FITMARKET_DELTA_PART:'+i+':'+delta.slice(i,i+1500));
          }
          const pkg = JSON.stringify(JSON.parse(fs.readFileSync('package.json', 'utf8')).devDependencies);
          console.log('FITMARKET_DEVDEPS:'+pkg);
          NODE
      - name: Switch spec types to Jasmine for compatibility test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.spec.json')
          p.write_text(p.read_text().replace('"vitest/globals"', '"jasmine"'))
          PY
      - name: Run Jasmine Karma tests in headless Chrome
        run: npx ng test --runner=karma --no-watch --no-progress --browsers=ChromeHeadless
